
# ==========================================
# BLUE AQUA — Kitty Configuration
# ==========================================

# Shell
shell /usr/bin/zsh

# Theme
include current-theme.conf

# Window appearance
background_opacity 0.88
background #1D3159
foreground #E6EEFF

# Font
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5

# Cursor
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

# Selection
selection_background #6382BF
selection_foreground #FFFFFF

# Window layout
window_padding_width 12
window_margin_width 4
single_window_margin_width 0
remember_window_size yes
initial_window_width 1100
initial_window_height 650

# Tabs

# Tab bar — Blue Aqua Powerline
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template " {index}: {title} "

active_tab_foreground #FFFFFF
active_tab_background #1F438C
active_tab_font_style bold

inactive_tab_foreground #E6EEFF
inactive_tab_background #1D3159
inactive_tab_font_style normal

tab_bar_background #1D3159


# Borders
active_border_color #6382BF
inactive_border_color #1D3159
bell_border_color #7EF2DD
window_border_width 1.5pt

# Behavior
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.0

# Scrollback
scrollback_lines 10000

# URL interaction
url_color #7EF2DD
detect_urls yes

# Mouse
mouse_hide_wait 3.0

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes
