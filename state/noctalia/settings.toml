config_version = 16

[bar.default]
background_opacity = 0.79999998211860657
end = [
    "tray",
    "notifications",
    "clipboard",
    "bluetooth",
    "volume",
    "brightness",
    "network",
    "battery",
    "control-center",
    "tray",
    "session"
]
margin_ends = 0
radius = 0
start = [ "launcher", "wallpaper", "workspaces", "media" ]
thickness = 40
widget_spacing = 10

[control_center]
sidebar = "full"
sidebar_section = "full"

    [control_center.calendar]
    show_events_card = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "thaer99ob/default-apps", "noctalia/wallhaven", "noctalia/bongocat", "yuuto/arch-updater", "tordex/processes" ]

[shell]
avatar_path = "/home/glhalton/Documentos/profile-picture/reimu.png"
panel_anchor_bar = "default"

    [shell.launcher]
    categories = false
    layout = "simple"

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"
    wallpaper_show_names = false

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Storm"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "kcolorscheme", "qt" ]

[wallpaper.default]
path = "/home/glhalton/Imagens/fubuki.png"

[wallpaper.last]
path = "/home/glhalton/Imagens/fubuki.png"

[wallpaper.monitors.eDP-1]
path = "/home/glhalton/Imagens/fubuki.png"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true
scale = 0.80000000000000004
show_label = false

[widget.bluetooth]
scale = 1.3

[widget.brightness]
enabled = false

[widget.clipboard]
scale = 1.3

[widget.clock]
format = "{:%d %b %H:%M}"
scale = 1.05

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
art_size = 18
hide_artist = true
hide_when_no_media = true
max_length = 275
title_scroll = "always"

[widget.network]
scale = 1.3
show_label = false

[widget.notifications]
scale = 1.3

[widget.session]
enabled = false

[widget.volume]
scale = 1.3
show_label = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
active_pill_size = 3.0
hide_when_empty = true
pill_scale = 0.70000000000000007
show_labels = false